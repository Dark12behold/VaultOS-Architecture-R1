name: Reasoning Learning Suite

on:
  push:
    branches:
      - staging/chatgpt-reasoning-learning-suite
    paths:
      - 'reasoning-learning-suite/**'
      - '.github/workflows/reasoning-learning-suite.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  self-test:
    name: Learning suite self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run analyzer tests
        run: python3 -m unittest discover -s reasoning-learning-suite/tests -p 'test_*.py' -v
      - name: Analyze available procedure runs
        run: |
          mkdir -p .generated-reasoning-learning
          python3 reasoning-learning-suite/tools/analyze_runs.py reasoning-learning-suite/runs .generated-reasoning-learning/summary.json
          cat .generated-reasoning-learning/summary.json
      - name: Upload learning summary
        uses: actions/upload-artifact@v4
        with:
          name: reasoning-learning-summary-${{ github.sha }}
          path: .generated-reasoning-learning/summary.json
          retention-days: 30
